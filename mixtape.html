<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mixtape — flat retro cassette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#EDE7D6; --ink:#17120F; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#DED7C3;color:var(--ink);font-family:"Barlow Condensed",system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(23,18,15,.18) 100%);mix-blend-mode:multiply}

  header{position:fixed;top:0;left:0;right:0;padding:22px 30px;display:flex;align-items:baseline;gap:14px;z-index:5}
  h1{font-family:"Archivo Black",sans-serif;font-size:clamp(26px,4.4vw,46px);letter-spacing:-.03em;margin:0;line-height:.9}
  .eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;transition:color .3s ease}

  .panel{position:fixed;left:30px;bottom:30px;z-index:5;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    padding:9px 18px 8px;border:2.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;
    transition:transform .12s ease,background .12s ease,color .12s ease}
  button:hover{background:var(--ink);color:var(--paper)}
  button:active{transform:translate(2px,2px)}
  button[data-on="1"]{background:var(--ink);color:var(--paper)}
  .meta{position:fixed;right:30px;bottom:30px;z-index:5;text-align:right;font-size:13px;letter-spacing:.16em;text-transform:uppercase;line-height:1.9}
  .counter{font-variant-numeric:tabular-nums}
  @media (max-width:640px){header{padding:16px 18px}.panel{left:18px;bottom:18px}.meta{right:18px;bottom:74px}}
</style>

<div id="stage"></div>
<div class="vignette"></div>

<header>
  <h1>mixtape</h1>
  <span class="eyebrow" id="eyebrow">flat retro · study 05</span>
</header>

<div class="panel">
  <button id="flip">flip side</button>
  <button id="play">play</button>
  <button id="colour">colour</button>
  <button id="reset">reset view</button>
</div>
<div class="meta">
  <div>side <b id="sideLabel">a</b> — <span id="cw">teal</span></div>
  <div class="counter" id="time">00:00 / 45:00</div>
  <div>drag rotate · scroll / pinch zoom</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- flat mixtape colourways (from the reference set) ----
const PALETTES=[
  {name:'teal',   label:'#37ACA3', ink:'#12201E', stripe:'#EDE7D6'},
  {name:'orange', label:'#EFA71D', ink:'#2A1D06', stripe:'#F6EFDB'},
  {name:'red',    label:'#E14E3B', ink:'#F2EAD7', stripe:'#F2EAD7'},
  {name:'blue',   label:'#37A6DD', ink:'#0C2430', stripe:'#EAF3F7'},
  {name:'green',  label:'#8DB63B', ink:'#1A2408', stripe:'#EEF0DD'},
  {name:'cream',  label:'#E6DDC4', ink:'#22190E', stripe:'#C94D3A'},
];

// ---- cassette layout constants (1 unit = 10 mm) ----
const W=10.05,H=6.38,D=1.25;
const REEL_X=2.28, REEL_Y=-.62, WIN_R=1.45;
const LW=9.6, LH=5.0, LCY=.4;                       // label plane bounds

// ---- flat label texture with alpha die-cut windows ----
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function labelTexture(side,pal){
  const W2=1400,H2=729,c=document.createElement('canvas');c.width=W2;c.height=H2;
  const ctx=c.getContext('2d');const big=side==='a'?'A':'B';
  const sx=W2/LW;                                   // px per world-unit (square)
  const cx=x=>(x/LW+.5)*W2, cy=y=>(1-((y-LCY)/LH+.5))*H2, rr=WIN_R*sx;
  ctx.clearRect(0,0,W2,H2);ctx.textBaseline='alphabetic';

  // sticker body (rounded; corners stay transparent → black shell shows)
  ctx.fillStyle=pal.label;roundRectPath(ctx,6,6,W2-12,H2-12,46);ctx.fill();

  // diagonal shine stripes
  ctx.save();ctx.translate(W2*.6,-40);ctx.rotate(-1.02);ctx.globalAlpha=.16;ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,60,1200);ctx.fillRect(120,0,26,1200);ctx.fillRect(180,0,14,1200);ctx.restore();

  // index write-lines + labels
  ctx.strokeStyle=pal.ink;ctx.globalAlpha=.85;ctx.lineWidth=4;
  [70,120].forEach(y=>{ctx.beginPath();ctx.moveTo(300,y);ctx.lineTo(1130,y);ctx.stroke();});
  ctx.globalAlpha=1;

  // light rings around the reel + centre windows
  ctx.fillStyle=pal.stripe;
  [-REEL_X,REEL_X].forEach(x=>{ctx.beginPath();ctx.arc(cx(x),cy(REEL_Y),rr+16,0,6.283);ctx.fill();});
  roundRectPath(ctx,cx(0)-140,cy(REEL_Y)-95,280,190,26);ctx.fill();

  // punch the actual holes (transparent)
  ctx.globalCompositeOperation='destination-out';
  [-REEL_X,REEL_X].forEach(x=>{ctx.beginPath();ctx.arc(cx(x),cy(REEL_Y),rr,0,6.283);ctx.fill();});
  roundRectPath(ctx,cx(0)-116,cy(REEL_Y)-72,232,150,20);ctx.fill();
  ctx.globalCompositeOperation='source-over';

  // type
  ctx.fillStyle=pal.ink;
  ctx.font='600 34px "Barlow Condensed",sans-serif';ctx.fillText('SIDE',54,72);
  ctx.font='800 74px "Archivo Black",Impact,sans-serif';ctx.fillText(big,150,92);
  ctx.font='600 34px "Barlow Condensed",sans-serif';ctx.textAlign='right';ctx.fillText('index',1346,74);ctx.textAlign='left';
  ctx.font='600 32px "Barlow Condensed",sans-serif';ctx.fillText('2 x 45 min',54,H2-40);
  ctx.font='800 96px "Archivo Black",Impact,sans-serif';ctx.textAlign='right';ctx.fillText('90',1346,H2-26);ctx.textAlign='left';

  // thin inner border
  ctx.strokeStyle=pal.ink;ctx.globalAlpha=.25;ctx.lineWidth=3;roundRectPath(ctx,20,20,W2-40,H2-40,34);ctx.stroke();ctx.globalAlpha=1;

  const t=new THREE.CanvasTexture(c);t.anisotropy=8;t.encoding=THREE.sRGBEncoding;return t;
}

/* ---------- scene ---------- */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,.1,200);camera.position.set(0,.6,26);

(function(){                                        // subtle env for glossy black plastic
  const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#ffffff');g.addColorStop(.5,'#cfc9ba');g.addColorStop(1,'#3a352e');
  x.fillStyle=g;x.fillRect(0,0,512,256);x.fillStyle='#ffffff';x.fillRect(60,24,150,60);x.fillRect(330,34,110,44);
  const tex=new THREE.CanvasTexture(c);tex.mapping=THREE.EquirectangularReflectionMapping;
  const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromEquirectangular(tex).texture;
})();

scene.add(new THREE.HemisphereLight(0xfff6e6,0x555049,.85));
const key=new THREE.DirectionalLight(0xffffff,1.15);key.position.set(5,8,10);scene.add(key);
const fill=new THREE.DirectionalLight(0xffe6c4,.4);fill.position.set(-8,-2,6);scene.add(fill);

/* ---------- geometry ---------- */
const tape=new THREE.Group();scene.add(tape);
function roundedRect(w,h,r,Cls){
  const s=new (Cls||THREE.Shape)();const x=-w/2,y=-h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y);   s.absarc(x+w-r,y+r,r,-Math.PI/2,0);
  s.lineTo(x+w,y+h-r); s.absarc(x+w-r,y+h-r,r,0,Math.PI/2);
  s.lineTo(x+r,y+h);   s.absarc(x+r,y+h-r,r,Math.PI/2,Math.PI);
  s.lineTo(x,y+r);     s.absarc(x+r,y+r,r,Math.PI,Math.PI*1.5);
  return s;
}
const shell=roundedRect(W,H,.42);
[-REEL_X,REEL_X].forEach(cx=>{const h=new THREE.Path();h.absarc(cx,REEL_Y,WIN_R,0,Math.PI*2,false);shell.holes.push(h);});
const shellGeo=new THREE.ExtrudeGeometry(shell,{depth:D,bevelEnabled:true,bevelThickness:.05,bevelSize:.05,bevelSegments:2,curveSegments:26});
shellGeo.translate(0,0,-D/2);
const shellMat=new THREE.MeshPhysicalMaterial({color:0x121110,metalness:0,roughness:.5,clearcoat:.2,clearcoatRoughness:.4,envMapIntensity:.3});
tape.add(new THREE.Mesh(shellGeo,shellMat));

// materials
const brown=new THREE.MeshStandardMaterial({color:0x5A3A22,roughness:.9});
const tapeMat=new THREE.MeshStandardMaterial({color:0x140C08,roughness:.4,metalness:.1});
const hubMat=new THREE.MeshStandardMaterial({color:0xF3F0E6,roughness:.5});
const darkMat=new THREE.MeshStandardMaterial({color:0x0B0908,roughness:.85});
const feltMat=new THREE.MeshStandardMaterial({color:0xC9B7A6,roughness:1});

// reels
const spools=[];
[-1,1].forEach(dir=>{
  const g=new THREE.Group();g.position.set(dir*REEL_X,REEL_Y,0);
  const pack=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.42,48),brown);pack.rotation.x=Math.PI/2;g.add(pack);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.7,26),hubMat);hub.rotation.x=Math.PI/2;g.add(hub);
  for(let i=0;i<6;i++){
    const t=new THREE.Mesh(new THREE.BoxGeometry(.17,.28,.66),hubMat);
    t.position.set(Math.cos(i/6*6.283)*.58,Math.sin(i/6*6.283)*.58,0);g.add(t);
  }
  tape.add(g);spools.push({g,pack});
});

// centre viewing window: tape span + felt pad (seen through label cut-out)
const midTape=new THREE.Mesh(new THREE.BoxGeometry(1.7,.5,.05),tapeMat);midTape.position.set(0,REEL_Y,.72);tape.add(midTape);
const midFelt=new THREE.Mesh(new THREE.BoxGeometry(1.2,.55,.08),feltMat);midFelt.position.set(0,REEL_Y,.69);tape.add(midFelt);

// bottom working edge
const headFrame=new THREE.Mesh(new THREE.BoxGeometry(1.8,.85,.5),darkMat);headFrame.position.set(0,-2.45,.42);tape.add(headFrame);
const felt=new THREE.Mesh(new THREE.BoxGeometry(1.05,.42,.12),feltMat);felt.position.set(0,-2.32,.24);tape.add(felt);
[-1.15,1.15].forEach(x=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.5,16),darkMat);c.rotation.x=Math.PI/2;c.position.set(x,-2.45,.42);tape.add(c);});
[-4.5,4.5].forEach(x=>{const t=new THREE.Mesh(new THREE.BoxGeometry(.58,.4,.08),darkMat);t.position.set(x,3.02,D/2);tape.add(t);});
[[-4.4,2.6],[4.4,2.6],[-4.4,-2.6],[4.4,-2.6],[0,-3.0]].forEach(([x,y])=>{
  const s=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.12,14),darkMat);s.rotation.x=Math.PI/2;s.position.set(x,y,D/2);tape.add(s);
});

// labels (full-face stickers, front + back)
let palIdx=0;
const labelMats={};
['a','b'].forEach((s,i)=>{
  const mat=new THREE.MeshStandardMaterial({map:labelTexture(s,PALETTES[0]),transparent:true,alphaTest:.5,roughness:.85,metalness:0});
  const m=new THREE.Mesh(new THREE.PlaneGeometry(LW,LH),mat);
  m.position.set(0,LCY,(i?-1:1)*(D/2+.12));if(i)m.rotation.y=Math.PI;
  labelMats[s]=mat;tape.add(m);
});
function applyPalette(){
  const p=PALETTES[palIdx];
  labelMats.a.map=labelTexture('a',p);labelMats.a.map.needsUpdate=true;labelMats.a.needsUpdate=true;
  labelMats.b.map=labelTexture('b',p);labelMats.b.map.needsUpdate=true;labelMats.b.needsUpdate=true;
  document.getElementById('cw').textContent=p.name;
  document.getElementById('eyebrow').style.color=p.label;
}
applyPalette();

/* ---------- interaction ---------- */
let targetRY=-.42,targetRX=.2,curRY=-.42,curRX=.2,flipped=0,dist=26;
let dragging=false,px=0,py=0;
const el=renderer.domElement;el.style.cursor='grab';el.style.touchAction='none';
const clampDist=d=>Math.max(15,Math.min(40,d));
const pointers=new Map();let pinchStart=0,pinchDist=dist;
const pinchGap=()=>{const p=[...pointers.values()];return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);};
el.addEventListener('pointerdown',e=>{
  el.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){dragging=true;px=e.clientX;py=e.clientY;el.style.cursor='grabbing';}
  else if(pointers.size===2){dragging=false;pinchStart=pinchGap();pinchDist=dist;}
});
el.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){const ratio=pinchStart>0?pinchGap()/pinchStart:1;dist=clampDist(pinchDist/ratio);return;}
  if(!dragging)return;
  targetRY+=(e.clientX-px)*.006;targetRX=Math.max(-.9,Math.min(.9,targetRX+(e.clientY-py)*.005));
  px=e.clientX;py=e.clientY;
});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)dragging=false;
  if(pointers.size===1){const p=[...pointers.values()][0];dragging=true;px=p.x;py=p.y;}el.style.cursor='grab';}
el.addEventListener('pointerup',endPointer);el.addEventListener('pointercancel',endPointer);
el.addEventListener('wheel',e=>{e.preventDefault();dist=clampDist(dist+e.deltaY*.02)},{passive:false});

const sideLabel=document.getElementById('sideLabel');
document.getElementById('flip').onclick=()=>{flipped^=1;targetRY+=Math.PI;sideLabel.textContent=flipped?'b':'a';};
let playing=false,pos=0;
const playBtn=document.getElementById('play'),timeEl=document.getElementById('time');
playBtn.onclick=()=>{playing=!playing;playBtn.dataset.on=playing?'1':'0';playBtn.textContent=playing?'pause':'play';};
document.getElementById('colour').onclick=()=>{palIdx=(palIdx+1)%PALETTES.length;applyPalette();};
document.getElementById('reset').onclick=()=>{targetRX=.2;targetRY=flipped?Math.PI-.42:-.42;dist=26;};

function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05);
  if(playing){pos=Math.min(1,pos+dt/2700*45);if(pos>=1)playing=false;}
  const rMin=.66,rMax=2.06,area=rMax*rMax-rMin*rMin;
  const rL=Math.sqrt(rMax*rMax-area*pos), rR=Math.sqrt(rMin*rMin+area*pos);
  spools[0].pack.scale.set(rL,1,rL);spools[1].pack.scale.set(rR,1,rR);
  if(playing&&!reduce){spools[0].g.rotation.z-=dt*3.4/rL;spools[1].g.rotation.z-=dt*3.4/rR;}
  const total=45*60,cur=Math.floor(pos*total);
  timeEl.textContent=String(Math.floor(cur/60)).padStart(2,'0')+':'+String(cur%60).padStart(2,'0')+' / 45:00';

  if(!dragging&&!reduce) targetRY+=dt*.09;
  curRY+=(targetRY-curRY)*.09;curRX+=(targetRX-curRX)*.09;
  tape.rotation.y=curRY;tape.rotation.x=curRX;
  tape.position.y=Math.sin(clock.elapsedTime*.7)*.12;
  camera.position.z+=(dist-camera.position.z)*.08;
  renderer.render(scene,camera);
}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(applyPalette);}
frame();
</script>
